<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Round 2 Login</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #1d4ed8;
      --error-bg: #fee2e2;
      --error-text: #991b1b;
      --success-bg: #dcfce7;
      --success-text: #166534;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .panel {
      width: 100%;
      max-width: 440px;
      background: var(--panel);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }
    h1 { margin: 0 0 6px 0; font-size: 26px; }
    p { margin: 0 0 18px 0; color: var(--muted); }
    form { display: grid; gap: 12px; }
    label { font-size: 13px; font-weight: 600; }
    input {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
    }
    input:focus {
      outline: none;
      border-color: #93c5fd;
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);
    }
    button {
      margin-top: 4px;
      border: 0;
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 14px;
      font-weight: 600;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
    }
    .flash {
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .flash.error { background: var(--error-bg); color: var(--error-text); }
    .flash.success { background: var(--success-bg); color: var(--success-text); }
    .footer { margin-top: 14px; font-size: 14px; color: var(--muted); }
    a { color: var(--primary); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <section class="panel">
    <h1>Round 2 Login</h1>
    <p>Improved spacing, form labels, and input validation flow.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post">
      <div>
        <label for="email">Email</label>
        <input id="email" type="email" name="email" value="{{ email }}" placeholder="name@example.com" required>
      </div>
      <div>
        <label for="password">Password</label>
        <input id="password" type="password" name="password" placeholder="Enter your password" required>
      </div>
      <button type="submit">Sign In</button>
    </form>

    <p class="footer">Need an account? <a href="{{ url_for('register') }}">Create one</a></p>
  </section>
</body>
</html>
