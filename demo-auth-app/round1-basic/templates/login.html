<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Round 1 Login</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px auto; max-width: 380px; }
    input, button { width: 100%; margin-bottom: 8px; padding: 8px; }
    .error { color: #b00020; }
    .success { color: #0f7d2b; }
  </style>
</head>
<body>
  <h2>Round 1 Basic Login</h2>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <p class="{{ category }}">{{ message }}</p>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="post">
    <input type="email" name="email" placeholder="Email" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>

  <p>No account? <a href="{{ url_for('register') }}">Register</a></p>
</body>
</html>
