<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Round 2 Dashboard</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #1d4ed8;
      --error-bg: #fee2e2;
      --error-text: #991b1b;
      --success-bg: #dcfce7;
      --success-text: #166534;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .panel {
      width: 100%;
      max-width: 520px;
      background: var(--panel);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }
    h1 { margin: 0 0 10px 0; font-size: 26px; }
    p { margin: 0 0 14px 0; color: var(--muted); }
    .flash {
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .flash.error { background: var(--error-bg); color: var(--error-text); }
    .flash.success { background: var(--success-bg); color: var(--success-text); }
    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <section class="panel">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <h1>Round 2 Dashboard</h1>
    <p>Welcome back, <strong>{{ email }}</strong>.</p>
    <p>This version uses cleaner structure and better spacing for readability.</p>

    <form method="post" action="{{ url_for('logout') }}">
      <button type="submit">Logout</button>
    </form>
  </section>
</body>
</html>
